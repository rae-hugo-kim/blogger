baseURL: "https://rae-hugo-kim.github.io/blogger/"
languageCode: "ko"
title: "Rae-Hugo-Kim's Blog"
theme: "blowfish"

enableRobotsTXT: true
enableSitemap: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags
  category: categories

params:
  colorScheme: "editorial"
  defaultAppearance: "dark"
  autoSwitchAppearance: true

  enableSearch: true
  enableCodeCopy: true

  mainSections:
    - posts

  homepage:
    showRecent: true
    showRecentItems: 5

  article:
    showDate: true
    showDateUpdated: false
    showAuthor: true
    showReadingTime: true
    showTableOfContents: true
    showTaxonomies: true
    showWordCount: false
    showComments: false

  list:
    showBreadcrumbs: false
    showTableOfContents: false
    showSummary: true
    groupByYear: true

  sitemap:
    changefreq: "weekly"
    priority: 0.5
    filename: "sitemap.xml"
