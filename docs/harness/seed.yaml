version: 2
status: draft

goal: >
  기술/개발 도메인의 개인 블로그를 Hugo로 구축하고, 외부에서 작성한 다양한 톤의 md 문서를
  에이전트와의 대화형 퇴고(톤 가이드 기반)로 블로그 톤에 맞게 다듬은 뒤, non-AI 게시
  정규화(scripts/normalize.py)로 SEO 프론트매터가 채워진 초안 번들을 조립하여
  GitHub Pages에 배포하여 실서비스로 운영한다.

constraints:
  - 회원가입/인증 기능을 구현하지 않는다
  - Hugo 정적 사이트 생성기를 사용한다
  - 게시 정규화는 non-AI 로컬 단계(scripts/normalize.py)로 동작한다 — CI에서의 AI 재작성 금지 (v2)
  - 정규화는 본문을 변경하지 않는다 (선두 h1 제거 제외); 코드 블록·링크 보존은 퇴고 규칙
  - 산문 퇴고는 사람 또는 에이전트가 docs/tone-guide.md를 컨텍스트로 수행한다 (v2)

acceptance_criteria:
  - hugo serve로 로컬에서 글 목록/상세 페이지가 정상 렌더링된다
  - 실제 도메인(GitHub Pages)에 배포되어 접속 가능하다
  - drafts/<slug>/를 scripts/normalize.py로 조립하면 프론트매터가 채워진 draft:true 번들이 생성된다 (v2 개정)
  - 정규화된 번들의 프론트매터(title, description, tags, date 등)가 완전히 채워져 있다 — 휴리스틱 채움은 auto-filled warning으로 표면화 (v2 개정)
  - 블로그 톤/형식 가이드가 퇴고 진입점에 배선되어 있다 (v2 개정 — AI 문체 변환 퇴역)

out_of_scope:
  - 다국어 지원 (한국어 단일 언어)
  - CMS 웹 관리자 패널
  - 회원가입/인증 시스템
  - CI에서의 AI 콘텐츠 재작성 (2026-07-15 추가 — 사용자 결정)

assumptions:
  - GitHub Actions는 배포(Pages, OIDC secretless)에만 사용한다 (v2 — 콘텐츠 CI 퇴역)
  - Hugo 테마는 기존 오픈소스 테마를 기반으로 커스터마이징한다
  - 블로그 톤 가이드 문서는 docs/tone-guide.md + 카테고리별 가이드로 정의됨
  - 크리덴셜 정본은 1Password Environments — 로컬 주입은 scripts/openv.sh, GitHub 저장 크리덴셜 0 (v2)

risks:
  - Hugo 테마 커스터마이징 범위가 확장될 수 있음
  - 휴리스틱 프론트매터가 SEO 규칙(description 150-160자 등)에 못 미침 → auto-filled warning + 퇴고에서 확정으로 완화 (v2)
  - 이미 프론트매터가 있는 md 투입 시 충돌 가능 → 기존 값 존중 정책 적용
  - 매우 짧은 메모 수준 글은 경고로 표면화

references:
  - path: docs/harness/kickoff-summary.md
    reason: 킥오프 인터뷰 전체 요약 (v1 시점 — CI 자동화 서술은 역사 기록)
  - path: docs/tone-guide.md
    reason: 퇴고·게시 정규화의 톤/형식 기준
