version: 1
status: draft

goal: >
  기술/개발 도메인의 개인 블로그를 Hugo로 구축하고, 외부에서 작성한 다양한 톤의 md 문서를
  Git 기반 자동화 파이프라인으로 블로그 톤에 맞게 정제하여 SEO 최적화된 초안을 생성한 뒤,
  GitHub Pages(또는 Vercel)에 배포하여 실서비스로 운영한다.

constraints:
  - 회원가입/인증 기능을 구현하지 않는다
  - Hugo 정적 사이트 생성기를 사용한다
  - 콘텐츠 정제는 Git push 기반 자동화로 동작해야 한다
  - 정제 시 코드 블록 내용은 변경하지 않는다
  - AI API는 메이저 3사(Anthropic, OpenAI, Google) 모두 사용 가능

acceptance_criteria:
  - hugo serve로 로컬에서 글 목록/상세 페이지가 정상 렌더링된다
  - 실제 도메인(GitHub Pages 또는 Vercel)에 배포되어 접속 가능하다
  - drafts/ 폴더에 md 파일을 push하면 SEO 메타, 태그, 요약이 자동 생성된 정제 초안이 만들어진다
  - 정제된 초안의 프론트매터(title, description, tags, date 등)가 완전히 채워져 있다
  - 블로그 톤/형식 가이드에 따라 문체가 통일된 초안이 생성된다

out_of_scope:
  - 다국어 지원 (한국어 단일 언어)
  - CMS 웹 관리자 패널
  - 회원가입/인증 시스템

assumptions:
  - GitHub Actions를 CI/CD로 사용한다
  - Hugo 테마는 기존 오픈소스 테마를 기반으로 커스터마이징한다
  - 블로그 톤 가이드 문서가 별도로 정의될 예정이다
  - AI API 키는 GitHub Secrets로 관리한다

risks:
  - AI 정제 결과의 품질이 일관되지 않을 수 있음 → 적대적 검증 시스템으로 완화
  - Hugo 테마 커스터마이징 범위가 확장될 수 있음
  - GitHub Actions에서 AI API 호출 비용 관리 필요
  - 이미 프론트매터가 있는 md 투입 시 충돌 가능 → 기존 값 존중 정책 적용
  - 매우 짧은 메모 수준 글의 정제 품질 저하 가능

references:
